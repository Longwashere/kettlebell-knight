# Publishes the phone companion to GitHub Pages: https://longwashere.github.io/kettlebell-knight/phone
# Release settings (PeerServer, TURN) come from repo Settings → Secrets and variables → Actions → Variables.
name: Deploy phone companion to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
          VITE_PEER_KEY: ${{ vars.VITE_PEER_KEY }}
          VITE_PEER_SECURE: ${{ vars.VITE_PEER_SECURE }}
          VITE_ICE_SERVERS_URL: ${{ vars.VITE_ICE_SERVERS_URL }}
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}phone
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
